<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stupid Rip-Offs Made by AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Stupid Rip-Offs<br><span>Made by AI</span></h1>
    <p class="tagline">Games you've definitely played before. Just worse.</p>
    <input id="search" type="search" placeholder="Search the knockoffs..." aria-label="Search games">
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>No rip-offs here yet. Check back soon.</p>
  </main>

  <footer>
    <p>Any resemblance to real games is entirely intentional.</p>
  </footer>

  <script src="games.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const search = document.getElementById('search');

    function render(filter = '') {
      const q = filter.toLowerCase();
      const list = GAMES.filter(g =>
        (g.title + ' ' + g.ripoffOf + ' ' + g.description).toLowerCase().includes(q)
      );
      grid.innerHTML = list.map(g => `
        <a class="card" href="${g.url || "games/" + g.file}">
          <div class="emoji">${g.emoji || '🎮'}</div>
          <h2>${g.title || 'Untitled Rip-Off'}</h2>
          <p class="ripoff">totally not ${g.ripoffOf || 'a real game'}</p>
          <p class="desc">${g.description || 'Just play it.'}</p>
          <span class="play">PLAY ▶</span>
        </a>
      `).join('');
      empty.hidden = list.length > 0;
    }

    search.addEventListener('input', e => render(e.target.value));
    render();
  </script>
</body>
</html>
